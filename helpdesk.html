<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="lab03-helpdesk">
    <meta name="keywords" content="HTML, Dcotype, form">
    <meta name="author" content="Napawuth Homsa-ard">
    <title>Help Desk Form</title>
</head>
<body>
    <a href="https://www.swinburne.edu.au/"><img src="logo.png" alt="Swinburne logo"></a><br>
    <h1>CWA Help Desk Appointment</h1>
    <p>The Help Desk is located in ATC620. Open 10:30 to 19:00 Monday to Friday<br><br>
        Check Blackboard for when CWA tutors will be there.
    </p>
    <form action="http://mercury.swin.edu.au/it000000/formtest.php" method="post">

        <fieldset>
            <legend>Student Detail</legend>
            <label for="student_id">Student ID:</label>
            <input type="text" id="student_id" name="student_id"
                pattern ="(\d){7,10}" title="Please enter 7 to 10 digits" required><br><br>
            <label for="given_name">Given Name:</label>
            <input type="text" id="given_name" name="given_name"
                pattern ="[A-Za-z\s]{1,15}" title ="Please enter only letters with max 15 characters" required>
            <label for="family_name">Family Name:</label>
            <input type="text" id="family_name" name="family_name"
                pattern ="[A-Za-z\s]{1,15}" title ="Please enter only letters with max 15 characters" required>
                <br><br>
        </fieldset>
        <br>

        <fieldset>
            <legend>Your Unit</legend>
            <input type="radio" id="cos10011" name="unit" value="COS10011" required>
            <label for="cos10011">COS10011</label>
            <input type="radio" id="cos60004" name="unit" value="COS60004" required>
            <label for="cos60004">COS60004</label>
            <input type="radio" id="cos60007" name="unit" value="COS60007" required>
            <label for="cos60007">COS60007</label>
            <br>
            <br>
            <label for="tutors">Your Tutor</label>
            <select name="tutors" id="tutors" required>
                <option value="">Please Select</option>
                <option value="Enrique Nicolás Ketterer Ortiz">Enrique Nicolás Ketterer Ortiz</option>
                <option value="Rahul Raghavan">Rahul Raghavan</option>
                <option value="Razeen Hashmi">Razeen Hashmi</option>
            </select>
            <br><br>
        </fieldset>
        <br>

        <fieldset>
            <legend>Issue</legend>
            <label for="html">HTML</label>
            <input type="checkbox" id="html" name="issue[]" value="HTML">
            <label for="css">CSS</label>
            <input type="checkbox" id="css" name="issue[]" value="CSS">
            <label for="javascript">JavaScript</label>
            <input type="checkbox" id="javascript" name="issue[]" value="JavaScript">
            <label for="php">PHP</label>
            <input type="checkbox" id="php" name="issue[]" value="PHP">
            <label for="mysql">MySQL</label>
            <input type="checkbox" id="mysql" name="issue[]" value="MYSQL">
            <br><br>
            <label for="description">Description of Issue</label><br>
            <textarea id="description" name="Description" rows="5" cols="100" placeholder="Please describe your issue here..." required></textarea>
            <br><br>
        </fieldset>
        <br>

        <fieldset>
            <legend>Preferred Date/Time</legend>
            <label for="date">Date</label>
            <input type="text" id="date" name="DATE" placeholder="dd/mm/yyyy" pattern="\d{2}/\d{2}/\d{4}" title ="Please enter a valid date in the format dd/mm/yyyy" required><br>
            <label for="time">Time</label>
            <input type="text" id="time" name="TIME" placeholder="00:00" pattern="([01]?[0-9]|2[0-3]):[0-5][0-9]" title ="Please enter a valid time in the format HH:MM" required><br><br>
        </fieldset>
        <input type="submit" value="Book">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
